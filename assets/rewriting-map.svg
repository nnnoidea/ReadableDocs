<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img">
<title>从难读的问题，找到改写方向</title><desc>左侧是阅读障碍，箭头指向对应改法。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6e80"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="28" y="22" width="5" height="30" rx="2" fill="#187e75"/>
<text x="48" y="46" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" font-weight="bold" fill="#203449">从难读的问题，找到改写方向</text>
<text x="48" y="75" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#5a6e80">左侧是阅读障碍，箭头指向对应改法。</text>
<g transform="translate(0,0)">
<polyline points="320,155 680,155" fill="none" stroke="#28679b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="320,265 680,265" fill="none" stroke="#187e75" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="320,375 680,375" fill="none" stroke="#96703a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="125" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="190" y="161" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">重点淹没在细节里</text>
<rect x="60" y="235" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="190" y="271" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">概念出现得太早</text>
<rect x="60" y="345" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="190" y="381" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">结构和步骤靠猜</text>
<rect x="680" y="125" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="810" y="161" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">先给主线，再补细节</text>
<rect x="680" y="235" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="810" y="271" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">先解释，再展开</text>
<rect x="680" y="345" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="810" y="381" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">用图画清关系与顺序</text>
<text x="32" y="520" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="normal" fill="#5a6e80">按目标读者与用户要求取舍内容，保留必要事实和条件。</text>
</g></svg>