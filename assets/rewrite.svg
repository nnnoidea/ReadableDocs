<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img">
<title>文档哪里难懂，就从哪里改</title><desc>按你的目的、读者和限制，取舍与组织内容</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6e80"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="28" y="22" width="5" height="30" rx="2" fill="#187e75"/>
<text x="48" y="46" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" font-weight="bold" fill="#203449">文档哪里难懂，就从哪里改</text>
<text x="48" y="75" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#5a6e80">按你的目的、读者和限制，取舍与组织内容</text>
<g transform="translate(0,0)">
<polyline points="320,155 680,155" fill="none" stroke="#28679b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="346" y="143" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="normal" fill="#5a6e80">调整顺序</text>
<polyline points="320,265 680,265" fill="none" stroke="#187e75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="346" y="231" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="normal" fill="#5a6e80">减少理解负担</text>
<polyline points="320,375 680,375" fill="none" stroke="#96703a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="346" y="363" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="normal" fill="#5a6e80">把关系画出来</text>
<rect x="60" y="125" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="190" y="161" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">重点被背景埋住</text>
<rect x="60" y="235" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="190" y="271" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">术语与条件挤在一起</text>
<rect x="60" y="345" width="260" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="190" y="381" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">关系和过程难懂</text>
<rect x="680" y="120" width="260" height="70" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="810" y="149.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">先呈现主干</text>
<text x="810" y="172.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">再按需要展开</text>
<rect x="680" y="230" width="260" height="70" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="810" y="259.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">首次解释概念</text>
<text x="810" y="282.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">必要条件紧贴结论</text>
<rect x="680" y="340" width="260" height="70" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="810" y="369.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">用图呈现结构与步骤</text>
<text x="810" y="392.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">配文补充必要信息</text>
<text x="32" y="520" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="normal" fill="#5a6e80">适用：平台介绍、使用说明、研究交接、知识解释；支持新写与改写。</text>
</g></svg>