<rect width="100%" height="100%" fill="white"/>
<rect x="28" y="22" width="5" height="30" rx="2" fill="#187e75"/>
<text x="48" y="46" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" font-weight="bold" fill="#203449">文件上传后，接下来做什么？</text>
<text x="48" y="75" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#5a6e80">检查文件格式和必填字段</text>
<g transform="translate(0,0)">
<polyline points="370,160 370,205 246.667,205 246.667,245" fill="none" stroke="#5a6e80" stroke-width="2" marker-end="url(#arrow)"/>
<text x="316.333" y="196" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="normal" fill="#203449">通过</text>
<polyline points="370,160 370,205 493.333,205 493.333,240" fill="none" stroke="#5a6e80" stroke-width="2" marker-end="url(#arrow)"/>
<text x="439.667" y="196" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="normal" fill="#203449">未通过</text>
<rect x="255" y="100" width="230" height="60" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="370" y="136" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">文件检查</text>
<rect x="131.667" y="250" width="230" height="60" rx="30" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="246.667" y="286" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">进入导入队列</text>
<rect x="378.333" y="245" width="230" height="70" rx="10" fill="#f1f6fa" stroke="#d8e2ea"/>
<text x="493.333" y="274.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">查看错误清单</text>
<text x="493.333" y="297.5" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203449">修正后重新上传</text>
<text x="32" y="480" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="normal" fill="#5a6e80">支持 CSV / XLSX，单文件最大 20 MB。演示材料。</text>
